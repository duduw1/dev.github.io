<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escolha seu Passeio</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
            background-color: #f4f4f4;
        }
        h1 {
            color: #333;
        }
        input[type="text"] {
            padding: 10px;
            font-size: 16px;
            width: 300px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #218838;
        }
        #resultado {
            margin-top: 20px;
            font-size: 18px;
            color: #333;
        }
    </style>
</head>
<body>

    <h1>Para onde você deseja passear?</h1>
    <input type="text" id="destinos" placeholder="Digite o destinos...">
    <br>
    <button onclick="escolherdestinos()">Confirmar</button>

    <div id="resultado"></div>

    <script>
async function salvardestinosNoGitHub(destinos) {
    const token = "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";
    const repo = "duduw1/Claro.github.io";
    const path = "destinos.txt";

    try {
        console.log("destinos a ser salvo:", destinos); // Adicionado para depuração
        const response = await fetch(`https://api.github.com/repos/${repo}/contents/${path}`, {
            headers: {
                Authorization: `token ${token}`,
            },
        });

        let sha = null;
        if (response.ok) {
            const data = await response.json();
            sha = data.sha;
            console.log("SHA do arquivo:", sha); // Adicionado para depuração
        }

        const content = btoa(`${destinos}\n`);
        const updateResponse = await fetch(`https://api.github.com/repos/${repo}/contents/${path}`, {
            method: 'PUT',
            headers: {
                Authorization: `token ${token}`,
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({
                message: "Atualizando destinos escolhido",
                content: content,
                sha: sha,
            }),
        });

        if (updateResponse.ok) {
            alert("destinos salvo no GitHub!");
        } else {
            alert("Erro ao salvar o destinos.");
        }
    } catch (error) {
        alert("Erro na requisição: " + error.message);
    }
}
    </script>

</body>
</html>
