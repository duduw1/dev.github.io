name: GitHub Stats Updater

on:
  schedule:
    # Runs every 8 hours
    - cron: '0 */8 * * *'
  workflow_dispatch:

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Create output directory
        run: mkdir -p generated

      - name: Generate Stats Card
        uses: anuraghazra/github-readme-stats@master
        with:
          username: duduw1
          show_icons: true
          theme: dracula
          filename: generated/stats.svg

      - name: Generate Top Langs Card
        uses: anuraghazra/github-readme-stats@master
        with:
          username: duduw1
          layout: compact
          theme: dracula
          filename: generated/top-langs.svg

      - name: Commit & Push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update GitHub stats"
          file_pattern: generated/*.svg
          commit_user_name: "github-actions[bot]"
          commit_user_email: "41898282+github-actions[bot]@users.noreply.github.com"
